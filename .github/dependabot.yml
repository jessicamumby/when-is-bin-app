# Version updates for the three places this app takes code from. Every
# ecosystem waits 7 days after a release before proposing it, so a
# compromised or broken release has time to be reported and pulled first.
# Updates are grouped to keep the PR count low; nothing merges itself.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      pub-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # 2.5.0 and 2.5.1 crash at startup in Android release builds
      # (NoSuchMethodError); 2.5.2 and later carry the fix.
      - dependency-name: shared_preferences_android
        versions: ["2.5.0", "2.5.1"]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      android-build:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
